# Builds the Windows, macOS and Android installers on GitHub's servers.
# Runs manually (Actions tab → "Compilar instaladores" → Run workflow)
# or when pushing a version tag, for example: git tag v0.1.0 && git push --tags
# With a tag, it also publishes the installers on the Releases page, with fixed
# names so the website's download links always point to the latest version.
name: Compilar instaladores

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

# pdfium version; must match the one pdfium-render expects (feature pdfium_7881).
env:
  PDFIUM_RELEASE: chromium%2F7881

# Needed to create the release in Releases.
permissions:
  contents: write

jobs:
  # The installers take their version from these files, not from the tag: if they don't match,
  # stop before compiling (the app would show the old number and Google Play would reject it).
  version:
    name: versión
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar que la etiqueta coincide con la versión
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          npm=$(jq -r .version package.json)
          tauri=$(jq -r .version src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"/\1/p' src-tauri/Cargo.toml | head -1)
          echo "Etiqueta: $tag · package.json: $npm · tauri.conf.json: $tauri · Cargo.toml: $cargo"
          if [ "$npm" != "$tag" ] || [ "$tauri" != "$tag" ] || [ "$cargo" != "$tag" ]; then
            echo "::error::La etiqueta $GITHUB_REF_NAME no coincide con la versión de los archivos. Pon \"$tag\" en package.json, src-tauri/tauri.conf.json y src-tauri/Cargo.toml, haz commit y crea la etiqueta de nuevo."
            exit 1
          fi

  build:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            runner: windows-latest
            pdfium: pdfium-win-x64.tgz
            library: bin/pdfium.dll
            args: --bundles nsis,msi
            installers: |
              src-tauri/target/release/bundle/nsis/*.exe
              src-tauri/target/release/bundle/msi/*.msi
            # Fixed installer name in Releases (the website links use it).
            release: src-tauri/target/release/bundle/nsis/*.exe
            release_name: Pliego-Windows.exe
          - name: macos
            runner: macos-latest
            # Universal binary: works on Apple Silicon and Intel.
            pdfium: pdfium-mac-univ.tgz
            library: lib/libpdfium.dylib
            args: --target universal-apple-darwin --bundles dmg
            installers: |
              src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            release: src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            release_name: Pliego-macOS.dmg

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      # Uses the pnpm version set in "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.name == 'macos' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Descargar pdfium
        shell: bash
        # Relative paths: Windows tar mistakes "D:\..." for a remote server.
        run: |
          mkdir -p pdfium-download src-tauri/pdfium
          curl -fsSL -o pdfium-download/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/download/${PDFIUM_RELEASE}/${{ matrix.pdfium }}"
          tar xzf pdfium-download/pdfium.tgz -C pdfium-download
          cp "pdfium-download/${{ matrix.library }}" src-tauri/pdfium/

      - run: pnpm install --frozen-lockfile

      - name: Tests
        working-directory: src-tauri
        run: cargo test

      - name: Compilar
        run: pnpm tauri build ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: pliego-${{ matrix.name }}
          path: ${{ matrix.installers }}
          if-no-files-found: error

      - name: Preparar instalador para Releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          mkdir -p release
          cp ${{ matrix.release }} "release/${{ matrix.release_name }}"

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true

  android:
    needs: version
    name: android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Descargar pdfium
        run: ./scripts/fetch-pdfium-android.sh

      - run: pnpm install --frozen-lockfile

      # The key never lives in the repository: it comes from the secrets (see scripts/android-signing.md).
      - name: Clave de firma
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::Faltan los secretos ANDROID_KEYSTORE_BASE64 y ANDROID_KEYSTORE_PASSWORD (ver scripts/android-signing.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/pliego-release.jks"
          {
            echo "storeFile=$RUNNER_TEMP/pliego-release.jks"
            echo "password=$KEYSTORE_PASSWORD"
            echo "keyAlias=pliego"
          } > src-tauri/gen/android/keystore.properties

      # APK for downloading from the website, AAB for Google Play.
      - name: Compilar
        run: |
          export NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          pnpm tauri android build --target aarch64 --target armv7 --target x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: pliego-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
          if-no-files-found: error

      - name: Preparar instalador para Releases
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          mkdir -p release
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk release/Pliego-Android.apk

      - name: Publicar en Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
