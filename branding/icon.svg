<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="sheet" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e8eefc"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0b1a4a" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background with the margin macOS icons use -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
  <!-- Sheet with a folded corner -->
  <g filter="url(#shadow)">
    <path d="M300 220 H600 L724 344 V780 a24 24 0 0 1 -24 24 H300 a24 24 0 0 1 -24 -24 V244 a24 24 0 0 1 24 -24 Z" fill="url(#sheet)"/>
  </g>
  <path d="M600 220 V320 a24 24 0 0 0 24 24 H724 Z" fill="#c7d4f5"/>
  <!-- Text lines -->
  <rect x="340" y="420" width="250" height="26" rx="13" fill="#9fb3e6"/>
  <rect x="340" y="490" width="320" height="26" rx="13" fill="#9fb3e6"/>
  <rect x="340" y="560" width="200" height="26" rx="13" fill="#9fb3e6"/>
  <!-- PDF label -->
  <rect x="340" y="296" width="150" height="70" rx="16" fill="#ef4444"/>
  <text x="415" y="345" text-anchor="middle" font-family="Helvetica Neue, Arial, sans-serif" font-weight="700" font-size="44" fill="#fff">PDF</text>
  <!-- Pencil -->
  <g transform="rotate(-45 640 660)">
    <rect x="520" y="625" width="250" height="70" rx="12" fill="#f59e0b"/>
    <rect x="740" y="625" width="50" height="70" rx="10" fill="#fcd34d"/>
    <path d="M520 625 L455 660 L520 695 Z" fill="#fde7c2"/>
    <path d="M475 650 L455 660 L475 670 Z" fill="#1f2937"/>
  </g>
</svg>
